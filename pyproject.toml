[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-star-chart"
version = "0.1.0"
description = "Customizable, self-hosted GitHub star history SVG charts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "3441293738"}]
dependencies = []

[project.scripts]
github-star-chart = "star_chart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
